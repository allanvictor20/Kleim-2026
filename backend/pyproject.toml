[project]
name = "kleim-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "geoalchemy2>=0.15",
  "redis>=5.0",
  "arq>=0.26",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "sentry-sdk>=2.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "factory-boy>=3.3", "ruff>=0.6", "mypy>=1.11", "schemathesis>=3.34"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.orders.*", "app.payments.*", "app.pricing.*", "app.ledger.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
asyncio_mode = "auto"
